
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      seed_bugs:
        description: "Activer les bugs du fil rouge (true/false)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      SEED_BUGS: ${{ github.event.inputs.seed_bugs || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Demarrer EventFlow
        run: |
          echo "Bugs du fil rouge : ${SEED_BUGS}"
          docker compose up -d --build

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Installer les dependances de test
        run: |
          pip install -r qa/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Attendre que l'application soit prete
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173/api/health && exit 0
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Tests API
        working-directory: qa
        run: pytest tests/api -n auto --alluredir=reports/allure-results --junitxml=reports/junit-api.xml

      - name: Tests UI Playwright
        if: success() || failure()
        working-directory: qa
        run: pytest tests/ui/playwright -n 2 --alluredir=reports/allure-results

      - name: Tests back-office Selenium
        if: success() || failure()
        working-directory: qa
        run: pytest tests/ui/selenium_backoffice --alluredir=reports/allure-results --output reports/selenium

      - name: Rapport Allure
        if: always()
        working-directory: qa
        run: npx --yes allure@3.33.0 generate reports/allure-results -o reports/allure-report

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rapports-qa
          path: qa/reports/
